[pytest]
# server/ on sys.path so `import config`, `import grader`, etc. resolve the same
# way they do when uvicorn runs `app:app` from this directory.
pythonpath = .
testpaths = tests

# Kill any test that hangs (a stuck subprocess/network call should fail fast,
# never block the suite). Override per-test with @pytest.mark.timeout(N).
timeout = 30
timeout_method = thread

# Parallelism is opt-in via the runner (bin/run_tests.sh) / `-n auto` so a bare
# `pytest -k foo` stays single-process and easy to debug. With --dist=loadfile
# each test file runs on one worker (no cross-file fixture surprises).
addopts = -q
